<!DOCTYPE html>
<html>

<head>
    <title>Socket.IO Chat</title>

    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
        }

        #messages {
            padding: 0;
        }

        #messages li {
            background: #222;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 6px;
            list-style: none;
        }

        input {
            padding: 10px;
            width: 75%;
            background: #111;
            color: white;
            border: 1px solid #444;
        }

        button {
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2>Chat Application</h2>

    <ul id="messages"></ul>

    <form id="form">

        <input
            id="input"
            autocomplete="off"
            placeholder="Enter message"
        >

        <button type="submit">
            Send
        </button>

    </form>


    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const messages = document.getElementById("messages");


        form.addEventListener("submit", (e) => {

            e.preventDefault();

            if (input.value) {

                socket.emit("chat message", input.value);

                input.value = "";
            }

        });


        socket.on("chat message", (msg) => {

            const item = document.createElement("li");

            item.textContent = "Sender: " + msg;

            messages.appendChild(item);

        });

    </script>

</body>

</html>
